<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
    />
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
    ></script>
    <title>Turnos Listados</title>
</head>
<body>
<header>
    <ul>
        <li><a href="pacientes_listados.html">Pacientes Listados</a></li>
        <li><a href="agregar_pacientes.html">Agregar Pacientes</a></li>
    </ul>
    <h1> <a href="index.html">Clinica BocaSana</a> </h1>
    <ul>
        <li><a href="odontologos_listados.html">Odontólogos Listados</a></li>
        <li><a href="agregar_odontologos.html">Agregar Odontólogos</a></li>
    </ul>
</header>
<div class="container mt-4">
    <h2>Lista de Turnos</h2>
    <table class="table table-bordered" id="TurnosTable">
        <thead>
        <tr>
            <th>ID del Paciente</th>
            <th>ID del Odontólogo</th>
            <th>Fecha</th>
            <th>ID</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <!-- Aquí se llenarán los datos con JavaScript -->
        </tbody>
    </table>
</div>

<!-- Modal para editar turno -->
<div class="modal fade" id="editModal" tabindex="-1" role="dialog" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editModalLabel">Editar Turno</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <div class="form-group">
                        <label for="editApellido">Id del paciente</label>
                        <input type="text" class="form-control" id="editApellido" required>
                    </div>
                    <div class="form-group">
                        <label for="editNombre">Id del odontologo</label>
                        <input type="text" class="form-control" id="editNombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="fecha" class="form-label">Fecha del turno</label>
                        <input type="date" class="form-control" id="fecha" required />
                    </div>
                    <input type="hidden" id="editId">
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="js/listarTurnos.js"></script>
</body>
</html>
