<header>
    <ul>
        <li><a href="pacientes_listados.html">Pacientes Listados</a></li>
        <li><a href="agregar_pacientes.html">Agregar Pacientes</a></li>

    </ul>
</header>

<div class="container mt-4">
    <h2>Agregar Turno</h2>
    <form id="agregarForm">
        <div class="mb-3">
            <label for="apellido" class="form-label">ID del Odontólogo</label>
            <input type="text" class="form-control" id="apellido" placeholder="Ingrese ID del odontólogo" required />
        </div>
        <div class="mb-3">
            <label for="nombre" class="form-label">ID del Paciente</label>
            <input type="text" class="form-control" id="nombre" placeholder="Ingrese ID del paciente" required />
        </div>
        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha del Turno</label>
            <input type="date" class="form-control" id="fecha" required />
        </div>
        <button type="submit" class="btn btn-primary">Agregar Turno</button>
    </form>
</div>

<script src="js/agregarTurnos.js"></script>
</body>
